# Render blueprint: one free web service + free Postgres.
#
# The API runs in single-process mode (INLINE_WORKER=true): grading, PayPal capture/void/payout
# and the timers run in background threads of the web process, so there is no Celery, no Redis
# and no paid worker. Files live in Postgres (BLOB_BACKEND=db). Migrations run on every start.
#
# Secrets (sync: false) are entered in the Render dashboard when the blueprint is created.
# Webhook URL to register in PayPal afterwards: https://<service>.onrender.com/webhooks/paypal
services:
  - type: web
    name: verdict-api
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: >-
      python -m alembic upgrade head &&
      uvicorn verdict.api.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /health
    envVars:
      - { key: PYTHON_VERSION, value: "3.12.7" }
      - key: DATABASE_URL
        fromDatabase: { name: verdict-db, property: connectionString }
      - { key: INLINE_WORKER, value: "true" }
      - { key: BLOB_BACKEND, value: db }
      - { key: SANDBOX_BACKEND, value: e2b }
      - { key: PAYPAL_ENV, value: sandbox }
      # true lets scripts use the X-User-Id dev header (sandbox only), but only with the
      # X-Dev-Token header = DEV_AUTH_TOKEN, so nobody else can mint users or admins on the
      # public URL. Set DEV_AUTH false once the web app logs in with PayPal.
      - { key: DEV_AUTH, value: "true" }
      - { key: DEV_AUTH_TOKEN, generateValue: true }
      # "Try it" buttons on the web app: a fresh demo buyer/worker/reviewer per visitor
      # (sandbox only, rate-limited per IP).
      - { key: DEMO_LOGIN, value: "true" }
      # The web app's origin. If Render gives verdict-web a different URL, change it here.
      - { key: CORS_ORIGINS, value: "https://verdict-web.onrender.com,http://localhost:3000" }
      - { key: PAYPAL_LOGIN_REDIRECT_URI, value: "https://verdict-web.onrender.com/auth/callback" }
      # true once that URL is the Return URL of "Log in with PayPal" in the PayPal app settings
      - { key: PAYPAL_LOGIN_ENABLED, value: "false" }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: PAYPAL_CLIENT_ID, sync: false }
      - { key: PAYPAL_SECRET, sync: false }
      - { key: PAYPAL_WEBHOOK_ID, sync: false }
      - { key: SANDBOX_WORKER_EMAIL, sync: false }
      - { key: E2B_API_KEY, sync: false }
      - { key: LLM_API_KEY, sync: false }
      - { key: LLM_FALLBACK_API_KEY, sync: false }
      - { key: RECEIPT_SIGNING_KEY_B64, sync: false }
      # When the web app is deployed, add CORS_ORIGINS, PAYPAL_RETURN_URL, PAYPAL_CANCEL_URL and
      # PAYPAL_LOGIN_REDIRECT_URI pointing at it (left out until then so defaults apply).

  # The web app (Vite + React, built to static files). Calls verdict-api from the browser.
  - type: web
    name: verdict-web
    runtime: static
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: VITE_API_URL, value: "https://verdict-api-zyaa.onrender.com" }

  # The scroll landing page (plain HTML/CSS/JS). Static sites are free and never sleep.
  - type: web
    name: verdict-site
    runtime: static
    buildCommand: echo "static landing page, no build"
    staticPublishPath: scrollcraft/builds/verdict

databases:
  - name: verdict-db
    plan: free
    postgresMajorVersion: "16"
