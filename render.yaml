# Render blueprint (Phase 5). Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: verdict-api
    runtime: python
    rootDir: .
    buildCommand: pip install -e .
    startCommand: uvicorn verdict.api.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: verdict-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: verdict-redis, property: connectionString }
      - { key: PAYPAL_ENV, value: sandbox }
      - { key: PAYPAL_CLIENT_ID, sync: false }
      - { key: PAYPAL_SECRET, sync: false }
      - { key: PAYPAL_WEBHOOK_ID, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: E2B_API_KEY, sync: false }
      - { key: RECEIPT_SIGNING_KEY_B64, sync: false }

  - type: worker
    name: verdict-worker
    runtime: python
    buildCommand: pip install -e .
    startCommand: cd backend && celery -A verdict.worker.celery_app worker -l info
    envVars:
      - fromGroup: verdict-shared
      - key: DATABASE_URL
        fromDatabase: { name: verdict-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: verdict-redis, property: connectionString }

  - type: worker
    name: verdict-beat
    runtime: python
    buildCommand: pip install -e .
    startCommand: cd backend && celery -A verdict.worker.celery_app beat -l info
    envVars:
      - fromGroup: verdict-shared
      - key: DATABASE_URL
        fromDatabase: { name: verdict-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: verdict-redis, property: connectionString }

  - type: web
    name: verdict-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - { key: NEXT_PUBLIC_PAYPAL_CLIENT_ID, sync: false }
      - { key: NEXT_PUBLIC_API_URL, sync: false }

  - type: redis
    name: verdict-redis
    ipAllowList: []

databases:
  - name: verdict-db
    postgresMajorVersion: "16"

envVarGroups:
  - name: verdict-shared
    envVars:
      - { key: PAYPAL_ENV, value: sandbox }
      - { key: PAYPAL_CLIENT_ID, sync: false }
      - { key: PAYPAL_SECRET, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: E2B_API_KEY, sync: false }
