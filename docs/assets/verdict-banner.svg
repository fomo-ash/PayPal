<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">Verdict</title>
  <desc id="d">Pay only for the code that passes. PayPal holds the money, Verdict checks the code, PayPal pays only for what passed.</desc>
  <defs>
    <clipPath id="frame"><rect width="1280" height="440" rx="28"/></clipPath>
    <pattern id="rule" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1C1A16" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="#F6F3EA"/>
    <rect x="780" width="500" height="440" fill="url(#rule)"/>
    <rect x="0.5" y="0.5" width="1279" height="439" rx="27.5" fill="none" stroke="#1C1A16" stroke-opacity="0.1"/>

    <!-- copy -->
    <g font-family="'Geist','Inter','SF Pro Display',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" fill="#141311">
      <g transform="translate(84 84)">
        <rect width="40" height="40" rx="10" fill="#001C64"/>
        <path d="M12 21l6 6 11-13" stroke="#F6F3EA" stroke-width="3.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="54" y="29" font-size="26" font-weight="600" letter-spacing="-0.4">Verdict</text>
      </g>
      <text x="84" y="214" font-size="60" font-weight="700" letter-spacing="-2.4">Pay only for the code</text>
      <text x="84" y="282" font-size="60" font-weight="700" letter-spacing="-2.4" fill="#001C64">that passes.</text>
      <text x="86" y="334" font-size="19" font-weight="400" fill="#5B574E">PayPal holds the money. Verdict tests the code. PayPal pays only for what passed.</text>
      <text x="86" y="372" font-family="'Geist Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#8A857A" letter-spacing="1.4">AUTHORIZE · TEST · JUDGE · CAPTURE / VOID · PAYOUT · SIGNED RECEIPT</text>
    </g>

    <!-- the hold card: $100 torn at the cents -->
    <g transform="translate(838 104)">
      <rect x="0" y="4" width="372" height="232" rx="18" fill="#1C1A16" fill-opacity="0.06"/>
      <rect x="0" y="0" width="372" height="232" rx="18" fill="#FFFFFF" stroke="#1C1A16" stroke-opacity="0.12"/>
      <g font-family="'Geist Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" fill="#141311">
        <text x="24" y="38" font-size="11" letter-spacing="1.6" fill="#8A857A">PAYPAL AUTHORIZATION</text>
        <text x="24" y="78" font-size="34" font-weight="600" letter-spacing="-1">$100.00</text>
        <rect x="270" y="22" width="78" height="24" rx="12" fill="#E7F6EC"/>
        <text x="309" y="38" text-anchor="middle" font-size="11" letter-spacing="1.2" fill="#15803D">SETTLED</text>
      </g>
      <!-- worker 71.39% -->
      <g transform="translate(24 112) rotate(-1.4 0 22)">
        <rect width="222" height="46" rx="10" fill="#16A34A"/>
        <text x="14" y="29" font-family="'Geist Mono','SF Mono',ui-monospace,Menlo,monospace" font-size="16" font-weight="600" fill="#FFFFFF">$71.39</text>
      </g>
      <!-- fee 3.76% -->
      <rect x="252" y="96" width="12" height="46" rx="3" fill="#C9C3B5" transform="rotate(2 258 119)"/>
      <!-- back to the buyer 24.85% -->
      <g transform="translate(270 118) rotate(1.8 0 22)">
        <rect width="78" height="46" rx="10" fill="#F6F3EA" stroke="#001C64" stroke-opacity="0.35"/>
        <text x="66" y="29" text-anchor="end" font-family="'Geist Mono','SF Mono',ui-monospace,Menlo,monospace" font-size="14" font-weight="600" fill="#001C64">$24.85</text>
      </g>
      <g font-family="'Geist','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5B574E">
        <text x="24" y="196">to the worker</text>
        <text x="348" y="196" text-anchor="end">released, never charged</text>
        <text x="24" y="214" fill="#8A857A" font-family="'Geist Mono','SF Mono',ui-monospace,Menlo,monospace" font-size="11">score 75.1% · fee $3.76</text>
      </g>
    </g>
  </g>
</svg>
