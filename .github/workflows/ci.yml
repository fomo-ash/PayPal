name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest respx ruff pydantic pydantic-settings sqlalchemy alembic httpx celery fastapi cryptography mcp
      - name: Unit tests + bench (pure-logic, no secrets needed)
        run: python -m pytest -q
      - name: Lint
        run: >-
          ruff check backend/verdict/core backend/verdict/grading backend/verdict/scanner
          backend/verdict/judge backend/verdict/db backend/verdict/worker backend/migrations
          backend/verdict/sandbox/e2b_runner.py backend/verdict/api backend/verdict/storage.py
          backend/verdict/paypal/webhooks.py backend/verdict/receipts backend/verdict/mcp
      - name: Guard against committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo ".env is committed!"; exit 1; fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Type-check and build the web app
        working-directory: apps/web
        run: npm ci && npm run build
