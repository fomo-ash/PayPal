# Local development services. Run: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: verdict
      POSTGRES_PASSWORD: verdict
      POSTGRES_DB: verdict
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdict"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:
